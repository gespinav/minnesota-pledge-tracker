name: Refresh news bulletin

# Keeps the "Upcoming Bills" legislative news bulletin current. Runs
# scripts/fetch-legislative-news.js on a schedule, and commits the refreshed
# public/data/upcoming-bills.json only when the headlines actually changed.
# That push to main triggers the existing "Deploy to GitHub Pages" workflow,
# so the live bulletin updates automatically.
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC); GitHub may delay under load
  workflow_dispatch:          # allow manual runs from the Actions tab

# contents:write to commit the refreshed data file; actions:write to kick off
# the Pages deploy afterward (a GITHUB_TOKEN push alone won't trigger it).
permissions:
  contents: write
  actions: write

# Never let two refreshes overlap; let an in-flight one finish.
concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # built-in fetch; the script has no npm deps

      - name: Fetch latest legislative news
        run: node scripts/fetch-legislative-news.js

      - name: Commit and deploy if the bulletin changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/upcoming-bills.json; then
            echo "No change in the bulletin — nothing to commit or deploy."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/upcoming-bills.json
          git commit -m "Auto-refresh legislative news bulletin"
          git push
          # A GITHUB_TOKEN push does NOT trigger other workflows (GitHub's
          # recursion guard), but workflow_dispatch is an allowed exception — so
          # explicitly kick the Pages deploy to push the fresh bulletin live.
          gh workflow run deploy-pages.yml --ref main
